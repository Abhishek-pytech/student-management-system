<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>StudentMS Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            background: #111827;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            padding: 10px;
            text-decoration: none;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
        }

        .main {
            margin-left: 260px;
            padding: 20px;
        }

        .card-box {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4>🎓 StudentMS</h4>
    <hr>
    <a href="/">Dashboard</a>
    <a href="/add/">Add Student</a>

    <a href="/attendance/">Attendance</a>
</div>

<div class="main">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
