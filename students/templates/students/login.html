<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | StudentMS</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #0f172a, #1e293b, #111827, #0b1220);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.login-card {
    width: 380px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 16px;
    padding: 30px;
    color: white;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    transform: perspective(1000px) rotateY(0deg);
    transition: 0.5s;
}

.login-card:hover {
    transform: perspective(1000px) rotateY(3deg);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
}

.form-control {
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
}

.form-control:focus {
    box-shadow: none;
    border: 1px solid #38bdf8;
}

.btn-login {
    background: linear-gradient(45deg, #2563eb, #38bdf8);
    border: none;
    width: 100%;
    padding: 10px;
    font-weight: 600;
    border-radius: 10px;
    transition: 0.3s;
}

.btn-login:hover {
    transform: scale(1.05);
}

small {
    color: #cbd5e1;
}

</style>
</head>

<body>

<div class="login-card">

    <h2>🎓 StudentMS Login</h2>
    <small class="d-block text-center mb-3">Secure Access for Admin Panel</small>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>

        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

        <button class="btn btn-login">Login</button>
    </form>

</div>

</body>
</html>
